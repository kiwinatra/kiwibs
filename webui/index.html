<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwi Brawl — Web UI</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --border: #2b303b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 240px; background: var(--card); border-right: 1px solid var(--border);
            padding: 20px; display: flex; flex-direction: column;
        }
        .logo { font-size: 18px; font-weight: 700; margin-bottom: 30px; color: #fff; }
        .nav-item {
            padding: 10px 15px; border-radius: 6px; color: var(--muted);
            cursor: pointer; margin-bottom: 5px; transition: 0.2s;
        }
        .nav-item.active { background: var(--primary); color: #fff; }
        .nav-item:hover:not(.active) { background: var(--border); color: var(--text); }
        
        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; }
        .header {
            height: 60px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background: var(--card);
        }
        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 6px var(--success); }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        .card-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .card-val { font-size: 22px; font-weight: 700; }
        
        /* Tabs Container */
        .content-area { flex: 1; padding: 0 20px 20px 20px; overflow-y: auto; }
        .tab { display: none; }
        .tab.active { display: block; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 500; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        /* Inputs & Buttons */
        .input { 
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 8px 12px; border-radius: 6px; outline: none; font-size: 13px; width: 100%;
        }
        .input:focus { border-color: var(--primary); }
        .btn {
            background: var(--primary); color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        
        /* Bottom Terminal */
        .bottom { height: 35%; border-top: 1px solid var(--border); display: flex; background: #090a0c; }
        .logs { flex: 1; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #a0aec0; }
        .log-line { margin-bottom: 4px; }
        .log-ok { color: var(--success); }
        .log-err { color: var(--danger); }
        .log-cmd { color: #fbbf24; font-weight: bold; }
        
        .console { width: 380px; padding: 15px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .console h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">● Kiwi Brawl</div>
        <div class="nav-item active" onclick="switchTab('dash', this)">Дашборд</div>
        <div class="nav-item" onclick="switchTab('players', this)">Игроки</div>
        <div class="nav-item" onclick="switchTab('rooms', this)">Комнаты</div>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <header class="header">
            <div class="status"><div class="dot"></div> Сервер активен</div>
            <div style="color: var(--muted); font-size: 13px;" id="clock">--:--:--</div>
        </header>

        <!-- STATS -->
        <div class="grid">
            <div class="card"><div class="card-title">Онлайн</div><div class="card-val" id="s-online">0</div></div>
            <div class="card"><div class="card-title">CPU</div><div class="card-val" id="s-cpu">0%</div></div>
            <div class="card"><div class="card-title">RAM</div><div class="card-val" id="s-ram">0%</div></div>
            <div class="card"><div class="card-title">Аптайм</div><div class="card-val" id="s-uptime">00:00</div></div>
        </div>

        <!-- TAB CONTENT -->
        <div class="content-area">
            
            <!-- TAB: DASHBOARD -->
            <div id="tab-dash" class="tab active">
                <h3 style="margin-bottom: 15px; font-size: 16px;">Быстрые действия</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button class="btn" onclick="sendCmd('kickall')">Кикнуть всех</button>
                    <button class="btn" onclick="sendCmd('maintenance 5')">Тех. работы (5 мин)</button>
                    <button class="btn" style="background: #333;" onclick="clearLogs()">Очистить логи</button>
                </div>
            </div>

            <!-- TAB: PLAYERS -->
            <div id="tab-players" class="tab">
                <input type="text" class="input" placeholder="Поиск по нику или ID..." onkeyup="filterPlayers()" id="search-player" style="margin-bottom: 15px;">
                <table>
                    <thead><tr><th>ID</th><th>Имя</th><th>Кубки</th><th>Золото</th><th>Комната</th><th>Действия</th></tr></thead>
                    <tbody id="players-list"></tbody>
                </table>
            </div>

            <!-- TAB: ROOMS -->
            <div id="tab-rooms" class="tab">
                <table>
                    <thead><tr><th>ID</th><th>Карта</th><th>Режим</th><th>Игроки (ID)</th></tr></thead>
                    <tbody id="rooms-list"></tbody>
                </table>
            </div>

        </div>

        <!-- BOTTOM LOGS & TERMINAL -->
        <div class="bottom">
            <div class="logs" id="logs-container"></div>
            <div class="console">
                <h3>Терминал сервера</h3>
                <input type="text" class="input" id="cmd-input" placeholder="Введите команду (help)..." onkeypress="if(event.key==='Enter') sendCmd()">
                <button class="btn" onclick="sendCmd()">Выполнить</button>
            </div>
        </div>
    </main>

    <script>
        // TABS
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
        }

        // STATS
        async function getStats() {
            try {
                const res = await fetch('/api/stats');
                const d = await res.json();
                if(d.error) return;
                document.getElementById('s-online').innerText = d.online;
                document.getElementById('s-cpu').innerText = d.cpu + '%';
                document.getElementById('s-ram').innerText = d.ram_percent + '%';
                document.getElementById('s-uptime').innerText = d.uptime;
            } catch(e){}
        }

        // PLAYERS
        let allPlayers = [];
        async function getPlayers() {
            try {
                const res = await fetch('/api/players');
                allPlayers = await res.json();
                renderPlayers(allPlayers);
            } catch(e){}
        }

        function renderPlayers(players) {
            let html = '';
            players.forEach(p => {
                html += `<tr>
                    <td>${p.low_id}</td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.trophies}</td>
                    <td>${p.gold}</td>
                    <td>${p.room_id === 0 ? '-' : p.room_id}</td>
                    <td><button class="btn btn-danger" style="padding:4px 8px;" onclick="sendCmd('kick ${p.low_id}')">Кик</button></td>
                </tr>`;
            });
            document.getElementById('players-list').innerHTML = html || '<tr><td colspan="6" style="text-align:center;">Нет игроков</td></tr>';
        }

        function filterPlayers() {
            const query = document.getElementById('search-player').value.toLowerCase();
            const filtered = allPlayers.filter(p => p.name.toLowerCase().includes(query) || p.low_id.toString().includes(query));
            renderPlayers(filtered);
        }

        // ROOMS
        async function getRooms() {
            try {
                const res = await fetch('/api/rooms');
                const rooms = await res.json();
                let html = '';
                rooms.forEach(r => {
                    html += `<tr>
                        <td>${r.id}</td>
                        <td>${r.map}</td>
                        <td>${r.type}</td>
                        <td>${r.players.join(', ')}</td>
                    </tr>`;
                });
                document.getElementById('rooms-list').innerHTML = html || '<tr><td colspan="4" style="text-align:center;">Нет активных комнат</td></tr>';
            } catch(e){}
        }

        // CONSOLE COMMAND
        async function sendCmd(overrideCmd) {
            const input = document.getElementById('cmd-input');
            const cmd = overrideCmd || input.value.trim();
            if (!cmd) return;
            if (!overrideCmd) input.value = '';

            try {
                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: cmd })
                });
                const d = await res.json();
                if(d.status === 'error') alert(d.message);
                else { getStats(); getPlayers(); getRooms(); }
            } catch(e){ alert('Ошибка отправки команды'); }
        }

        // LOGS (SSE)
        function initLogs() {
            const container = document.getElementById('logs-container');
            let autoScroll = true;
            
            container.addEventListener('scroll', () => {
                autoScroll = (container.scrollHeight - container.scrollTop) <= (container.clientHeight + 30);
            });

            const evt = new EventSource('/api/logs');
            evt.onmessage = (e) => {
                const data = JSON.parse(e.data);
                const line = document.createElement('div');
                line.className = 'log-line';
                if (data.text.includes('[ OK  ]')) line.classList.add('log-ok');
                if (data.text.includes('[ERROR]')) line.classList.add('log-err');
                if (data.text.includes('[CMD]')) line.classList.add('log-cmd');
                line.innerText = data.text;
                container.appendChild(line);
                
                if (container.childNodes.length > 500) container.removeChild(container.firstChild);
                if (autoScroll) container.scrollTop = container.scrollHeight;
            };
        }

        function clearLogs() {
            document.getElementById('logs-container').innerHTML = '';
        }

        // CLOCK
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        
        // INIT
        getStats(); getPlayers(); getRooms(); initLogs();
        setInterval(getStats, 3000);
        setInterval(getPlayers, 5000);
        setInterval(getRooms, 5000);
    </script>
</body>
</html>
